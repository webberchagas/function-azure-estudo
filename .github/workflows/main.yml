name: Build and Deploy Azure Function (Java)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =====================================================
  # JOB 1 - BUILD
  # =====================================================
  build:
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Azure Function
        run: mvn clean package -DskipTests         
        
      - name: Upload function package
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: target/azure-functions/*
            
  # =====================================================
  # JOB 2 - DEPLOY
  # =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev

    permissions:
      id-token: write
      contents: read
      
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package
          path: function-package

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy Azure Function (Flex)
        env:
          FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          az functionapp deploy \
            --resource-group $RESOURCE_GROUP \
            --name $FUNCTION_APP_NAME \
            --src-path function-package \
            --type java
