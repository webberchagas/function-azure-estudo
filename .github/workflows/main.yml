name: Build and Deploy Azure Function (Java)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =====================================================
  # JOB 1 - BUILD
  # =====================================================
  build:
    runs-on: ubuntu-latest
    environment: dev
      
    env:
      FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      SERVICE_PLAN: ${{ vars.SERVICE_PLAN }}
      LOCATION: ${{ vars.LOCATION }}
      JAVA_VERSION: ${{ vars.JAVA_VERSION }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Replace values in pom.xml
        run: |
          sed -i "s|\${FUNCTION_APP_NAME}|${FUNCTION_APP_NAME}|g" pom.xml
          sed -i "s|{RESOURCE_GROUP}|${RESOURCE_GROUP}|g" pom.xml
          sed -i "s|{SERVICE_PLAN}|${vars.SERVICE_PLAN}|g" pom.xml
          sed -i "s|{LOCATION}|${vars.LOCATION}|g" pom.xml

      - name: Build Azure Function
        run: ./mvnw clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: |
            target/*.jar
            pom.xml

  # =====================================================
  # JOB 2 - DEPLOY
  # =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read
      
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package
          
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function
        run: ./mvnw azure-functions:deploy
