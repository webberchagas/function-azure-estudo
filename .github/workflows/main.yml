name: Build and Deploy Azure Function (Java)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =====================================================
  # JOB 1 - BUILD
  # =====================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Azure Function with Maven
        run: ./mvnw clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: target/*.jar

  # =====================================================
  # JOB 2 - DEPLOY
  # =====================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev

    permissions:
      id-token: write
      contents: read

    env:
      FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      SERVICE_PLAN: ${{ vars.SERVICE_PLAN }}
      LOCATION: ${{ vars.LOCATION }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package
          path: target

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Replace values in pom.xml
        run: |
          sed -i "s|\${functionAppName}|${FUNCTION_APP_NAME}|g" pom.xml
          sed -i "s|{resourceGroup}|${RESOURCE_GROUP}|g" pom.xml
          sed -i "s|{servicePlane}|${SERVICE_PLAN}|g" pom.xml
          sed -i "s|{location}|${LOCATION}|g" pom.xml

      - name: Deploy Azure Function
        run: ./mvnw azure-functions:deploy
